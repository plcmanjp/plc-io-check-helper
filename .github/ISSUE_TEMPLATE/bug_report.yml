name: Bug report / 버그 제보
description: Report an app problem without including private or production-sensitive information. / 개인정보나 운영 민감정보 없이 앱 문제를 제보하세요.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        ## Public issue notice / 공개 이슈 안내
        GitHub Issues are public. Do not include PLC IP addresses, host names, project files, passwords, access tokens, serial numbers, customer names, screenshots with sensitive data, or production configuration details.

        GitHub Issues는 공개됩니다. PLC IP 주소, 호스트명, 프로젝트 파일, 비밀번호, 접근 토큰, 시리얼 번호, 고객명, 민감정보가 보이는 화면, 운영 설정 상세를 작성하지 마세요.

        You may write in Korean, English, Japanese, Simplified Chinese, Traditional Chinese, or Vietnamese.
        한국어, English, 日本語, 简体中文, 繁體中文, Tiếng Việt로 작성할 수 있습니다.
  - type: dropdown
    id: area
    attributes:
      label: Affected area / 문제 영역
      description: Choose the closest app feature. / 가장 가까운 앱 기능을 선택하세요.
      options:
        - Connection and PLC communication / 연결 및 PLC 통신
        - Device monitor or batch monitor / 디바이스 또는 배치 모니터
        - IO check / IO 체크
        - Project, import, or export / 프로젝트, 가져오기 또는 내보내기
        - Logger, HMI, calculator, or tools / 로거, HMI, 계산기 또는 도구
        - Accessibility, language, or appearance / 접근성, 언어 또는 화면 표시
        - Other / 기타
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior / 실제 동작
      description: Describe what happened and any visible error message. / 실제로 발생한 동작과 표시된 오류를 작성하세요.
      placeholder: The app ... / 앱이 ...
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce / 재현 단계
      description: List the smallest repeatable steps. Use anonymized values only. / 익명화한 값만 사용해 최소 재현 단계를 순서대로 작성하세요.
      placeholder: |
        1. Open ... / ...을 엽니다.
        2. Tap ... / ...을 누릅니다.
        3. Observe ... / ...을 확인합니다.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior / 기대 동작
      description: Describe the result you expected. / 기대한 결과를 작성하세요.
    validations:
      required: true
  - type: input
    id: app_version
    attributes:
      label: App version / 앱 버전
      description: Enter the version shown in the app or Google Play. / 앱 또는 Google Play에 표시된 버전을 입력하세요.
      placeholder: "0.0.0 (versionCode 0)"
    validations:
      required: true
  - type: input
    id: android_version
    attributes:
      label: Android version / Android 버전
      description: Enter the Android version, not a device identifier. / 기기 식별자가 아닌 Android 버전을 입력하세요.
      placeholder: Android 14
    validations:
      required: true
  - type: input
    id: device_model
    attributes:
      label: Device model / 기기 모델
      description: Enter a general model name only. Do not enter serial numbers or account information. / 일반 모델명만 입력하고 시리얼 번호나 계정 정보는 입력하지 마세요.
      placeholder: Galaxy S series
    validations:
      required: true
  - type: textarea
    id: plc_context
    attributes:
      label: PLC context / PLC 환경
      description: Provide only anonymized PLC family, connection type, and app settings relevant to the symptom. Do not include addresses, host names, network details, project files, or production configuration. / 증상과 관련된 익명화된 PLC 계열, 연결 방식, 앱 설정만 작성하세요. 주소, 호스트명, 네트워크 상세, 프로젝트 파일, 운영 설정은 작성하지 마세요.
      placeholder: FX5U, Ethernet TCP, binary frame / FX5U, Ethernet TCP, binary frame
    validations:
      required: true
  - type: checkboxes
    id: public_ack
    attributes:
      label: Public information confirmation / 공개 정보 확인
      options:
        - label: I confirm that this report contains no private, customer, credential, network, project-file, or production-sensitive information. / 이 제보에는 개인정보, 고객 정보, 자격 증명, 네트워크 정보, 프로젝트 파일, 운영 민감정보가 없습니다.
          required: true
